name: "Linux Build"

inputs:
  use-mumps:
    description: 'Indicates if GMGPolar should be built with mumps support'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        rm -f $(grep -rl 'pdi\.dev' /etc/apt/sources.list.d/ 2>/dev/null)
        apt-get -qq update
        apt-get -qq -y install lcov cmake make g++ git
    - name: Install additional dependencies to use MUMPS
      if: inputs.use-mumps == 'true'
      uses: ./.github/actions/install-dependencies
    - name: Cache Kokkos
      id: restore-cache-kokkos
      uses: actions/cache/restore@v5
      with:
        path: third-party/kokkos-openmp
        key: kokkos-openmp-v5.0.2
    - name: Install Kokkos (OpenMP)
      shell: bash
      if: steps.restore-cache-kokkos.outputs.cache-hit != 'true'
      run: |
        mkdir -p third-party
        cd third-party
        git clone --depth 1 --branch 5.0.2 https://github.com/kokkos/kokkos.git kokkos_src_openmp
        cmake \
              -D CMAKE_CXX_STANDARD=20 \
              -D Kokkos_ENABLE_DEPRECATED_CODE_4=OFF \
              -D Kokkos_ENABLE_DEPRECATION_WARNINGS=OFF \
              -D Kokkos_ENABLE_SERIAL=ON \
              -D Kokkos_ENABLE_OPENMP=ON \
              -B build_kokkos_openmp \
              -S kokkos_src_openmp
        cmake --build build_kokkos_openmp --parallel 4
        cmake --install build_kokkos_openmp --prefix $PWD/kokkos-openmp
        rm -rf build_kokkos_openmp kokkos_src_openmp
    - name: Save Kokkos cache
      if: steps.restore-cache-kokkos.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: third-party/kokkos-openmp
        key: ${{ steps.restore-cache-kokkos.outputs.cache-primary-key }}
    - name: Build
      shell: bash
      run: |
        mkdir build && cd build
        export Kokkos_ROOT=$GITHUB_WORKSPACE/third-party/kokkos-openmp
        export CMAKE_PREFIX_PATH=$Kokkos_ROOT:/opt/openmp
        export CXXFLAGS="-Wall -Wextra -pedantic -Wno-unused -Wfloat-conversion"
        cmake -DCMAKE_BUILD_TYPE=Debug -DGMGPOLAR_ENABLE_COVERAGE=ON -DGMGPOLAR_USE_MUMPS=${{ inputs.use-mumps }} ..
        make -j4
    - name: create build dir archive
      shell: bash
      run: |
        tar -czf build.tar.gz build
    - name: Upload build dir archive
      uses: actions/upload-artifact@v7
      with:
        name: build-cpp-linux-gmgpolar${{ inputs.use-mumps == 'true' && '-mumps' || ''}}
        path: build.tar.gz
        retention-days: 1
